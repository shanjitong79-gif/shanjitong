<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>善鸡通 AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#182230;background:#eef3f9}button,textarea{font:inherit}.app{height:100dvh;display:flex;overflow:hidden;background:linear-gradient(135deg,#e9eff7,#f9fbfe)}
.sidebar{width:260px;padding:18px;border-right:1px solid #d7e0eb;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);flex:none}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;margin:3px 4px 18px}.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#fff;border:1px solid #d6dfeb;box-shadow:0 5px 18px #aab7c933}.new{width:100%;border:1px solid #c6d3e3;background:#fff;border-radius:11px;padding:11px 14px;cursor:pointer;text-align:left}.side-note{color:#64748b;font-size:13px;line-height:1.7;margin:18px 5px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:60px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid #d9e2ec;background:#ffffff99;backdrop-filter:blur(18px);font-weight:600}.status{margin-left:auto;font-size:12px;color:#64748b;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#94a3b8}.dot.ok{background:#22a06b}.chat{flex:1;overflow:auto;padding:30px clamp(16px,8vw,110px)}.welcome{text-align:center;margin:12vh auto 35px;max-width:680px}.welcome .hero{font-size:46px;margin:0 0 12px}.welcome h1{font-size:34px;margin:0 0 12px}.welcome p{color:#64748b;margin:0}.suggestions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.suggestions button{background:#fff;border:1px solid #d5dfeb;border-radius:10px;padding:9px 12px;color:#334155;cursor:pointer}.msg{display:flex;margin:18px 0}.msg.user{justify-content:flex-end}.bubble{max-width:min(820px,90%);padding:13px 16px;border-radius:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 10px #71809612}.ai .bubble{background:#fff;border:1px solid #dbe4ee}.user .bubble{background:#1677ff;color:#fff}.composer{padding:12px clamp(14px,8vw,110px) 22px;background:linear-gradient(transparent,#eef3f9 28%)}.box{display:flex;gap:9px;align-items:flex-end;background:#fff;border:1px solid #bccbdd;border-radius:15px;padding:8px;box-shadow:0 8px 30px #61738c18}.box textarea{flex:1;min-height:46px;max-height:150px;border:0;outline:0;resize:none;padding:10px 9px;background:transparent}.send{height:46px;border:0;border-radius:11px;background:#1677ff;color:#fff;padding:0 18px;cursor:pointer}.send:disabled{opacity:.55;cursor:wait}.hint{text-align:center;font-size:11px;color:#94a3b8;margin-top:7px}@media(max-width:700px){.sidebar{display:none}.topbar{padding:0 16px}.chat{padding:18px 14px}.composer{padding:10px 12px 15px}.welcome{margin:10vh auto 25px}.welcome .hero{font-size:40px}.welcome h1{font-size:27px}.bubble{max-width:94%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="logo">🧠</span><span>善鸡通 AI</span></div>
  <button class="new" id="newChat">＋ 新对话</button>
  <div class="side-note">你的专属 AI 助手<br>Web 1.0 · 手机优先<br><br>AI API 密钥只保存在服务器端，不放在网页代码里。</div>
</aside>
<main class="main">
  <header class="topbar">善鸡通 AI <span class="status"><i class="dot" id="dot"></i><span id="statusText">检查服务中…</span></span></header>
  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="hero">🧠</div><h1>你好，我是善鸡通 AI</h1>
      <p>聊天、写作、总结、翻译，都可以从这里开始。</p>
      <div class="suggestions"><button>帮我写一段介绍</button><button>帮我总结一篇文章</button><button>解释一个问题</button></div>
    </div>
  </section>
  <footer class="composer"><div class="box"><textarea id="input" rows="1" placeholder="输入你的问题…"></textarea><button class="send" id="send">发送</button></div><div class="hint">善鸡通 AI 1.0 · AI 回答可能存在错误，请自行核实重要信息</div></footer>
</main>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
const dot=document.getElementById('dot'),statusText=document.getElementById('statusText');
let messages=[];
function add(role,text){document.getElementById('welcome')?.remove();const row=document.createElement('div');row.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b}
function reset(){messages=[];chat.innerHTML='<div class="welcome" id="welcome"><div class="hero">🧠</div><h1>你好，我是善鸡通 AI</h1><p>新的对话已经准备好了。</p></div>';input.focus()}
async function ask(text){input.value='';add('user',text);messages.push({role:'user',content:text});sendBtn.disabled=true;const thinking=add('ai','正在思考…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');thinking.textContent=d.reply||'AI 没有返回内容。';messages.push({role:'assistant',content:d.reply||''});}catch(e){thinking.textContent='连接失败：'+e.message;}finally{sendBtn.disabled=false;input.focus()}}
function send(){const t=input.value.trim();if(t&&!sendBtn.disabled)ask(t)}
sendBtn.onclick=send;document.getElementById('newChat').onclick=reset;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>ask(b.textContent));
fetch('/api/health').then(r=>r.json()).then(d=>{dot.classList.toggle('ok',d.aiConfigured);statusText.textContent=d.aiConfigured?'AI 已连接':'等待配置 AI'}).catch(()=>{statusText.textContent='服务异常'});
</script>
</body>
</html>
