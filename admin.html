<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shanjitong 新闻后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3fb;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033}.wrap{max-width:850px;margin:auto;padding:18px 14px 50px}.card{background:#ffffffdb;border:1px solid #ccd5e5;border-radius:22px;padding:18px;box-shadow:0 12px 35px #38527c16;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row h2{flex:1}input,textarea,select{width:100%;padding:13px;border:1px solid #ccd5e5;border-radius:12px;font:inherit;background:white}textarea{min-height:150px}.form{display:grid;gap:10px}button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;background:white;box-shadow:0 2px 10px #38527c18}button.primary{background:#4f7cff;color:#fff}.hidden{display:none}.item{padding:14px 0;border-bottom:1px solid #e7ebf2}.item:last-child{border-bottom:0}.small{font-size:12px;color:#7d8799}
</style></head><body><main class="wrap"><div class="row"><h2>shanjitong 新闻后台</h2><button onclick="location.href='/'">官网</button></div>
<section id="login" class="card"><h3>管理员登录</h3><div class="form"><input id="u" placeholder="账号"><input id="p" type="password" placeholder="密码"><button class="primary" onclick="login()">登录</button></div></section>
<section id="panel" class="hidden"><div class="card"><h3 id="formTitle">发布新闻</h3><div class="form"><input id="title" placeholder="标题"><input id="summary" placeholder="摘要"><textarea id="content" placeholder="正文"></textarea><select id="status"><option value="published">立即发布</option><option value="draft">保存草稿</option></select><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="row"><button class="primary" onclick="save()">保存新闻</button><button onclick="resetForm()">清空</button><button onclick="logout()">退出</button></div></div></div>
<div class="card"><h3>新闻列表</h3><div id="items"></div></div></section></main>
<script>
let editId=null,editImage='';
const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});showPanel()}catch(e){alert(e.message)}}
async function showPanel(){ $('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}
async function load(){let a=await api('/api/admin/news');$('items').innerHTML=a.map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="small">${x.status==='published'?'已发布':'草稿'} · ${new Date(x.created_at).toLocaleString()}</div><div class="row" style="margin-top:8px"><button onclick="edit(${x.id})">编辑</button><button onclick="del(${x.id})">删除</button></div></div>`).join('')||'暂无新闻'}
async function save(){let file=$('image').files[0],image=editImage;if(file){let fd=new FormData();fd.append('image',file);let r=await fetch('/api/admin/upload',{method:'POST',body:fd});let d=await r.json();if(!r.ok)return alert(d.error);image=d.image}
let body={title:$('title').value.trim(),summary:$('summary').value.trim(),content:$('content').value.trim(),status:$('status').value,image};if(!body.title||!body.content)return alert('请填写标题和正文');
try{await api(editId?'/api/admin/news/'+editId:'/api/admin/news',{method:editId?'PUT':'POST',body:JSON.stringify(body)});alert('保存成功');resetForm();load()}catch(e){alert(e.message)}}
async function edit(id){let a=await api('/api/admin/news'),x=a.find(v=>v.id==id);if(!x)return;editId=id;editImage=x.image||'';$('title').value=x.title;$('summary').value=x.summary;$('content').value=x.content;$('status').value=x.status;$('formTitle').textContent='编辑新闻'}
async function del(id){if(!confirm('确定删除？'))return;try{await api('/api/admin/news/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
function resetForm(){editId=null;editImage='';$('formTitle').textContent='发布新闻';$('title').value='';$('summary').value='';$('content').value='';$('status').value='published';$('image').value=''}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
api('/api/me').then(showPanel).catch(()=>{})
</script></body></html>
