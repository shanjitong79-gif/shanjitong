<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>shanjitong · 手机新闻后台</title>
<style>
:root{--bg:#edf4fb;--panel:rgba(255,255,255,.78);--text:#172033;--muted:#667085;--line:rgba(20,45,80,.12);--accent:#0067c0}.dark{--bg:#0e141c;--panel:rgba(25,33,44,.9);--text:#f5f7fb;--muted:#aeb8c7;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(135deg,#eaf4ff,#f7f9fc,#e5f2ff);min-height:100vh}.dark{background:#0d131b}.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(20px)}.wrap{max-width:1000px;margin:auto;padding:18px 14px 40px}.top{position:sticky;top:10px;z-index:5;border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top strong{font-size:20px}.btn{min-height:46px;padding:10px 16px;border:0;border-radius:12px;cursor:pointer;background:rgba(0,103,192,.1);color:var(--text)}.primary{background:var(--accent);color:#fff}.danger{background:#d93025;color:#fff}.login{max-width:430px;margin:12vh auto;padding:25px;border-radius:22px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input,textarea,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.45);color:var(--text);font-size:16px}textarea{min-height:190px;resize:vertical}.dash{display:none}.dash.show{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.editor,.item{border-radius:20px;padding:18px;margin-bottom:14px}.item{display:flex;gap:14px;align-items:center}.thumb{width:90px;height:70px;object-fit:cover;border-radius:10px}.grow{flex:1}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:600px){.item{align-items:flex-start}.thumb{width:75px;height:60px}.actions .btn{flex:1}.top{position:relative;top:0}}
</style></head><body><div class="wrap">
<div id="login" class="glass login"><h1>shanjitong</h1><p class="muted">手机新闻管理后台</p><div class="field"><label>管理员账号</label><input id="user" autocomplete="username"></div><div class="field"><label>管理员密码</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" id="loginBtn">登录后台</button><p id="msg" class="muted"></p></div>
<div id="dash" class="dash"><header class="glass top"><strong>📰 新闻控制中心</strong><div class="actions"><button class="btn" id="theme">☾</button><button class="btn" id="logout">退出</button></div></header>
<section class="glass editor"><h2 id="formTitle">发布新闻</h2><input type="hidden" id="id"><div class="field"><label>标题</label><input id="title" placeholder="新闻标题"></div><div class="field"><label>摘要</label><textarea id="summary" style="min-height:90px" placeholder="新闻摘要"></textarea></div><div class="field"><label>正文</label><textarea id="content" placeholder="输入新闻正文"></textarea></div><div class="field"><label>状态</label><select id="status"><option value="published">立即发布</option><option value="draft">保存草稿</option></select></div><div class="field"><label>新闻图片（最大 5MB）</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div id="preview" class="muted"></div></div><div class="actions"><button class="btn primary" id="save">保存新闻</button><button class="btn" id="new">新建</button></div></section>
<h2>文章列表</h2><div id="list"></div></div></div>
<script>
const $=s=>document.querySelector(s);let editing=null;
function applyTheme(){if(localStorage.adminTheme==="dark")document.body.classList.add("dark")}applyTheme();$("#theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.adminTheme=document.body.classList.contains("dark")?"dark":"light"};
async function api(url,opt={}){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"请求失败");return d}
async function check(){const m=await api("/api/me");if(m.loggedIn){$("#login").classList.add("hidden");$("#dash").classList.add("show");load()}}
$("#loginBtn").onclick=async()=>{try{await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("#user").value,password:$("#pass").value})});check()}catch(e){$("#msg").textContent=e.message}};
$("#logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()};
$("#new").onclick=()=>reset();
$("#image").onchange=()=>{$("#preview").textContent=$("#image").files[0]?$("#image").files[0].name:""};
async function save(){try{let image=editing?.image||"";const f=$("#image").files[0];if(f){const fd=new FormData();fd.append("image",f);image=(await api("/api/admin/upload",{method:"POST",body:fd})).url}
const body={title:$("#title").value,summary:$("#summary").value,content:$("#content").value,status:$("#status").value,image};
if(editing)await api("/api/admin/news/"+editing.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});else await api("/api/admin/news",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
reset();load()}catch(e){alert(e.message)}}
$("#save").onclick=save;
async function load(){const a=await api("/api/admin/news");$("#list").innerHTML=a.length?a.map(n=>`<article class="glass item">${n.image?`<img class="thumb" src="${n.image}">`:``}<div class="grow"><b>${esc(n.title)}</b><div class="muted">${n.status==="published"?"已发布":"草稿"} · ${new Date(n.created_at).toLocaleString("zh-CN")}</div></div><div class="actions"><button class="btn" onclick='edit(${JSON.stringify(n)})'>编辑</button><button class="btn danger" onclick="del(${n.id})">删除</button></div></article>`).join(""):`<div class="glass editor">还没有新闻。</div>`}
function edit(n){editing=n;$("#formTitle").textContent="编辑新闻";$("#id").value=n.id;$("#title").value=n.title;$("#summary").value=n.summary;$("#content").value=n.content;$("#status").value=n.status;$("#preview").textContent=n.image?"当前图片已保存，可选择新图片替换":"暂无图片";scrollTo({top:0,behavior:"smooth"})}
function reset(){editing=null;$("#formTitle").textContent="发布新闻";["title","summary","content","id","preview"].forEach(x=>$("#"+x).value="");$("#preview").textContent="";$("#status").value="published";$("#image").value=""}
async function del(id){if(!confirm("确定删除这篇新闻？"))return;await api("/api/admin/news/"+id,{method:"DELETE"});load()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}check();
</script></body></html>
